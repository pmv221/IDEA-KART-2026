<!DOCTYPE html>
<html lang='fr'>
<head>
<meta charset='utf-8'>
<meta name='viewport' content='width=device-width, initial-scale=1, viewport-fit=cover'>
<title>Marathon Jules Bianchi 2026 — Pilotes</title>
<style>
:root{--bg:#FFFFFF;--panel:#F6F7F9;--ink:#15181E;--mut:#6A7180;--faint:#9AA1AE;--line:#E3E6EC;--line2:#D3D8E0;--accent:#C8102E;--cat:#2A3342;--catbg:#EEF1F5;--amber:#B7791F;--r:6px;--shadow:0 1px 2px rgba(20,24,30,.06)}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased;line-height:1.4;padding-bottom:40px}
.num{font-variant-numeric:tabular-nums}
.wrap{max-width:660px;margin:0 auto;padding:0 14px}
header{background:var(--ink);color:#fff;border-bottom:3px solid var(--accent);position:sticky;top:0;z-index:20}
header .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 14px}
h1{font-size:13.5px;margin:0;font-weight:700;letter-spacing:1.2px;text-transform:uppercase}
.h-sub{font-size:10px;color:#AEB4C0;margin-top:3px;letter-spacing:1.5px;text-transform:uppercase;font-weight:600}
.h-clock{font-size:9.5px;color:#AEB4C0;text-align:right;letter-spacing:1px;text-transform:uppercase;min-width:92px}
.h-clock b{display:block;font-size:16px;color:#fff;letter-spacing:1px;margin-top:2px;font-variant-numeric:tabular-nums}
.live{margin-top:14px;display:flex;align-items:center;gap:11px;border:1px solid var(--line);border-radius:var(--r);padding:11px 13px;background:var(--panel)}
.live .dot{width:9px;height:9px;border-radius:50%;background:var(--faint);flex:none}
.live.on .dot{background:var(--accent);box-shadow:0 0 0 4px rgba(200,16,46,.14)}
.live .lt{flex:1;min-width:0}
.live .lt .t{font-size:12px;font-weight:700;letter-spacing:.3px}
.live .lt .s{font-size:10.5px;color:var(--mut);margin-top:1px}
.live a,.live span.btn{font-size:11px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;text-decoration:none;padding:8px 13px;border-radius:5px;white-space:nowrap}
.live a{background:var(--accent);color:#fff}
.live span.btn{background:var(--line);color:var(--faint)}
.meta{font-size:11px;color:var(--mut);margin-top:9px;text-align:center;letter-spacing:.2px}
.lbl{font-size:10px;text-transform:uppercase;letter-spacing:1.4px;color:var(--mut);font-weight:700;margin:18px 2px 8px}
select{width:100%;padding:14px 13px;font-size:16px;font-weight:600;border-radius:var(--r);border:1px solid var(--line2);background:#fff;color:var(--ink)}
.phead{margin-top:8px;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow)}
.ph-top{padding:14px 15px;display:flex;align-items:center;gap:11px;border-bottom:1px solid var(--line)}
.ph-name{font-size:19px;font-weight:800;flex:1;letter-spacing:.2px}
.chip{font-size:10px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;padding:4px 9px;border-radius:4px;background:var(--catbg);color:var(--cat)}
.ph-stats{display:flex}
.ps{flex:1;padding:10px 6px;text-align:center;border-right:1px solid var(--line)}
.ps:last-child{border:none}
.ps .v{font-size:16px;font-weight:800}
.ps .k{font-size:9px;color:var(--mut);text-transform:uppercase;letter-spacing:.7px;margin-top:2px;font-weight:600}
.next{margin-top:14px;border:1px solid var(--line2);border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow)}
.next .nh{background:var(--ink);color:#fff;padding:8px 14px;font-size:10px;letter-spacing:1.4px;text-transform:uppercase;font-weight:700;display:flex;justify-content:space-between;align-items:center}
.next .nh .rn{color:#AEB4C0}
.cdrow{display:flex}
.cd{flex:1;padding:14px 15px;border-right:1px solid var(--line)}
.cd:last-child{border:none}
.cd .k{font-size:9.5px;color:var(--mut);text-transform:uppercase;letter-spacing:.8px;font-weight:700}
.cd .big{font-size:26px;font-weight:800;line-height:1.05;margin-top:4px}
.cd .abs{font-size:11.5px;color:var(--mut);margin-top:2px;font-weight:600}
.cd.go .big{color:var(--accent)}
.cd.urgent .big{color:var(--accent)}
.cd.urgent .k{color:var(--accent)}
.pan{padding:9px 15px;border-top:1px solid var(--line);font-size:11.5px;color:var(--mut);font-weight:600}
.pan b{color:var(--ink)}
.stint{margin-top:9px;border:1px solid var(--line);border-radius:var(--r);padding:11px 14px;display:flex;align-items:center;gap:12px;background:#fff}
.stint.next-line{border-color:var(--accent);border-left-width:3px}
.stint.done{opacity:.5}
.stint .rn{font-size:10.5px;font-weight:800;color:var(--faint);letter-spacing:.5px;min-width:38px}
.stint .mid{flex:1}
.stint .mid .e{font-size:15px;font-weight:800}
.stint .mid .c{font-size:11px;color:var(--amber);font-weight:600;margin-top:1px}
.stint .rt{text-align:right}
.stint .rt .d{font-size:12px;font-weight:700;color:var(--mut)}
.stint .rt .st{font-size:9.5px;color:var(--faint);text-transform:uppercase;letter-spacing:.5px;margin-top:1px;font-weight:700}
.stint .rt .st.now{color:var(--accent)}
.foot{margin-top:22px;text-align:center}
.lk{font-size:11.5px;color:var(--mut);background:none;border:none;text-decoration:underline;cursor:pointer;padding:8px}
.hint{font-size:12.5px;color:var(--mut);text-align:center;padding:28px 20px;line-height:1.7}
.track{margin-top:10px;padding:9px 13px;border:1px solid var(--line);border-radius:var(--r);font-size:12.5px;background:#fff;display:flex;align-items:center;gap:9px}
.track .tk{font-size:9.5px;font-weight:800;letter-spacing:.6px;text-transform:uppercase;padding:3px 8px;border-radius:4px;background:var(--ink);color:#fff;white-space:nowrap}
.track.on{border-color:var(--accent)}
.track.on .tk{background:var(--accent)}
.track.chg .tk{background:var(--amber)}
.chg{margin-top:14px;border:1px solid #F2D9A6;border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow)}
.chg .ch{background:#FFF8E8;color:#7A5200;padding:8px 14px;font-size:10px;letter-spacing:1.4px;text-transform:uppercase;font-weight:800}
.chg .cl{padding:9px 14px;border-top:1px solid #F5E6C4;font-size:12.5px;display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.chg .cl .w{color:var(--mut);font-size:10.5px;white-space:nowrap}
.chg .ok{display:block;width:100%;border:none;border-top:1px solid #F2D9A6;background:#FFF8E8;color:#7A5200;font:inherit;font-size:12px;font-weight:800;letter-spacing:1px;text-transform:uppercase;padding:13px;cursor:pointer}
.tag{display:inline-block;font-size:9px;font-weight:800;letter-spacing:.4px;text-transform:uppercase;padding:2px 6px;border-radius:3px;margin-left:7px;vertical-align:2px}
.tag.m{background:#FFE3A8;color:#7A5200}
.tag.r{background:#FDE3E6;color:#A30D24}
.ps .v.bad{color:var(--accent)}
.warn{padding:9px 15px;border-top:1px solid var(--line);font-size:11.5px;color:var(--accent);font-weight:700}
</style>
</head>

<header><div class='wrap'>
<div><h1>Marathon Jules Bianchi 2026</h1><div class='h-sub'>Circuit Paul Ricard</div></div>

</div></header>

</div>

const JOURS=['dim','lun','mar','mer','jeu','ven','sam'];
const REPOS_MIN=7199;
const dep=new Date(CFG.dep),arrivee=new Date(CFG.arrivee);
const R=CFG.relays.map(x=>({r:x.r,cat:x.cat,name:x.n,dur:x.d,conv:new Date(x.c),debut:new Date(x.e),fin:new Date(x.f),pan:new Date(x.p),
 rep:(typeof x.rz==='number'?x.rz:-1),couru:!!x.x,prevu:x.m||'',ct:x.ct?new Date(x.ct):null,on:x.on||'',oe:x.oe?new Date(x.oe):null}));

const names=[];
PIL.forEach(p=>{if(p.a&&!names.includes(p.n))names.push(p.n);});
R.forEach(x=>{if(!names.includes(x.name))names.push(x.name);});
let SEL=null;
const LS={get(k){try{return localStorage.getItem(k);}catch(e){return null;}},set(k,v){try{localStorage.setItem(k,v);}catch(e){}}};
const VU=CFG.mod||CFG.maj;
const ACK={};
function ackOf(n){if(!(n in ACK)){let s=LS.get('mjb_ack_'+n);if(!s){s=VU;LS.set('mjb_ack_'+n,s);}ACK[n]=new Date(s);}return ACK[n];}
function isFresh(x,n){return !!(x.ct&&x.ct>ackOf(n));}
function ackNow(){if(SEL===null)return;LS.set('mjb_ack_'+SEL,VU);ACK[SEL]=new Date(VU);renderPanel();}
const pad=n=>String(n).padStart(2,'0');
const hhmm=d=>pad(d.getHours())+':'+pad(d.getMinutes());
const jour=d=>JOURS[d.getDay()];
const jh=d=>jour(d)+' '+hhmm(d);
function dl(sec){sec=Math.max(0,Math.round(sec));if(sec>=86400){const j=Math.floor(sec/86400),h=Math.floor(sec%86400/3600);return j+' j '+pad(h)+' h';}
const h=Math.floor(sec/3600),m=Math.floor(sec%3600/60);if(h>0)return h+' h '+pad(m);if(m>0)return m+' min';return `moins d'1 min`;}
function minlbl(s){return Math.round(s/60)+' min';}
function esc(s){return String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}
function info(n){return PIL.find(p=>p.n===n)||{n:n};}
function isDone(x,now){return x.couru||x.fin<=now;}
function nextIdx(list,now){for(let i=0;i<list.length;i++)if(!isDone(list[i],now))return i;return -1;}
function reposKo(x){return x.rep>=0&&x.rep<REPOS_MIN;}
function changesFor(n,now){
const out=[];
R.forEach(x=>{
 if(!x.ct||isDone(x,now)||!isFresh(x,n))return;
 const w=`modifié ${jh(x.ct)}`;
 if(x.name===n&&x.on===n&&x.oe)out.push({t:`<b>R${x.r}</b> : ${jh(x.oe)} &rarr; <b>${jh(x.debut)}</b>`,w:w});
 else if(x.name===n&&x.on!==n)out.push({t:`<b>R${x.r}</b> : nouveau relais pour toi, <b>${jh(x.debut)}</b>`,w:w});
 else if(x.on===n&&x.name!==n)out.push({t:`<b>R${x.r}</b> : relais retiré, confié à ${esc(x.name)}`,w:w});
});
return out;}
function curRelay(now){
for(const x of R){if(now>=x.debut&&now<x.fin&&!x.couru)return {s:'piste',x:x};}
if(now<dep)return {s:'avant'};
if(now>=arrivee)return {s:'fini'};
for(let i=0;i<R.length-1;i++){if(isDone(R[i],now)&&!isDone(R[i+1],now))return {s:'stand',x:R[i+1]};}
return {s:'fini'};}
function renderTrack(){
const el=document.getElementById('track'),now=new Date(),c=curRelay(now);
if(c.s==='piste'){const nx=R[c.x.r];el.className='track on';
 el.innerHTML=`<span class='tk'>En piste</span><span><b>${esc(c.x.name)}</b> · R${c.x.r} · sortie ~${hhmm(c.x.fin)}${nx?' · panneau '+hhmm(c.x.pan)+' ('+esc(nx.name)+')':''}</span>`;}
else if(c.s==='stand'){el.className='track chg';el.innerHTML=`<span class='tk'>Changement</span><span><b>${esc(c.x.name)}</b> prend le volant (R${c.x.r})</span>`;}
else if(c.s==='avant'){el.className='track';el.innerHTML=`<span class='tk'>Avant course</span><span>Départ ${jh(dep)}</span>`;}
else{el.className='track';el.innerHTML=`<span class='tk'>Terminé</span><span>Course terminée</span>`;}}
function fillMeta(){
document.getElementById('meta').textContent=CFG.n+' pilotes · '+CFG.nrel+' relais · CAT 1 '+CFG.d1+' min · CAT 2 '+CFG.d2+' min · arrivée '+jh(arrivee);
if(CFG.maj){const d=new Date(CFG.maj);document.getElementById('maj').textContent='Page mise à jour le '+jour(d)+' '+pad(d.getDate())+'/'+pad(d.getMonth()+1)+' à '+hhmm(d);}}
function buildSelect(){
const sel=document.getElementById('who');
names.forEach((nm,i)=>{const o=document.createElement('option');o.value=String(i);o.textContent=nm;sel.appendChild(o);});
sel.onchange=()=>{SEL=sel.value===''?null:names[+sel.value];LS.set('mjb_pilote',SEL||'');renderPanel();};
const mem=LS.get('mjb_pilote');const ix=mem?names.indexOf(mem):-1;
if(ix>=0){sel.value=String(ix);SEL=names[ix];}}
function chgHtml(ch){
if(!ch.length)return '';
let h=`<div class='chg'><div class='ch'>Changements pour toi</div>`;
ch.forEach(c=>{h+=`<div class='cl'><span>${c.t}</span><span class='w'>${c.w}</span></div>`;});

function renderPanel(){
const p=document.getElementById('panel');
if(SEL===null){p.innerHTML=`<div class='hint'>Sélectionne ton nom pour voir tes horaires, le compte à rebours avant ta convocation et ton entrée en piste.</div>`;return;}
const now=new Date(),mine=R.filter(x=>x.name===SEL),pi=info(SEL),ch=changesFor(SEL,now);
if(!mine.length){p.innerHTML=chgHtml(ch)+`<div class='hint'>Aucun relais attribué à ${esc(SEL)} pour le moment.</div>`;return;}
const volant=mine.reduce((a,b)=>a+b.dur,0),nx=nextIdx(mine,now),cat=pi.c||mine[0].cat;
const hasL=typeof pi.l==='number',lb=hasL&&pi.l>CFG.lmax;
const lt=hasL?(lb?CFG.lmax+' max':String(Math.round(pi.l*10)/10).replace('.',',')+' kg'):'—';
let h=`<div class='phead'><div class='ph-top'><div class='ph-name'>${esc(SEL)}</div><span class='chip'>Catégorie ${cat}</span></div><div class='ph-stats'>`;
h+=`<div class='ps'><div class='v num'>${mine.length}</div><div class='k'>relais</div></div>`;
h+=`<div class='ps'><div class='v num'>${dl(volant)}</div><div class='k'>volant total</div></div>`;
h+=`<div class='ps'><div class='v num'>${minlbl((nx>=0?mine[nx]:mine[0]).dur)}</div><div class='k'>par relais</div></div>`;
h+=`<div class='ps'><div class='v num ${lb?'bad':''}'>${lt}</div><div class='k'>lest</div></div></div></div>`;
h+=chgHtml(ch);
if(nx>=0){
 const x=mine[nx],toConv=(x.conv-now)/1000,toGo=(x.debut-now)/1000,driving=(now>=x.debut&&now<x.fin&&!x.couru);
 h+=`<div class='next'><div class='nh'><span>${driving?'Tu es en piste':'Prochain relais'}</span><span class='rn'>Relais ${x.r} · ${minlbl(x.dur)}</span></div><div class='cdrow'>`;
 h+=`<div class='cd ${toConv<=1800&&toConv>0?'urgent':''}'><div class='k'>Convocation dans</div><div class='big num'>${toConv>0?dl(toConv):'—'}</div><div class='abs'>${jh(x.conv)}</div></div>`;
 h+=`<div class='cd go'><div class='k'>Entrée en piste dans</div><div class='big num'>${toGo>0?dl(toGo):(driving?'en cours':'—')}</div><div class='abs'>${jh(x.debut)}</div></div></div>`;
 if(!driving&&x.r>1){const pv=R[x.r-2];h+=`<div class='pan'>Tu montres le panneau SORTIE à <b>${esc(pv.name)}</b> vers <b>${hhmm(pv.pan)}</b></div>`;}
 if(reposKo(x))h+=`<div class='warn'>&#9888; Repos de ${dl(x.rep)} seulement avant ce relais (minimum 2 h)</div>`;
 h+=`</div>`;
}else{
 h+=`<div class='next'><div class='nh'><span>Relais terminés</span></div><div class='cd'><div class='abs' style='padding:6px 0'>Tous tes relais sont passés. Bravo.</div></div></div>`;
}
h+=`<div class='lbl'>Tous mes relais</div>`;
mine.forEach((x,i)=>{
 const isNext=i===nx,done=isDone(x,now),driving=(now>=x.debut&&now<x.fin&&!x.couru),pv=x.r>1?R[x.r-2]:null;
 let tags='';
 if(x.prevu&&isFresh(x,SEL))tags+=`<span class='tag m'>à la place de ${esc(x.prevu)}</span>`;
 if(reposKo(x))tags+=`<span class='tag r'>repos ${dl(x.rep)}</span>`;
 h+=`<div class='stint ${isNext?'next-line':''} ${done?'done':''}'><div class='rn num'>R${x.r}</div><div class='mid'><div class='e num'>${jh(x.debut)}${tags}</div>`;
 h+=`<div class='c num'>convocation ${jh(x.conv)}${pv?' · panneau '+hhmm(pv.pan):''}</div></div>`;
 h+=`<div class='rt'><div class='d num'>${minlbl(x.dur)}</div><div class='st ${driving?'now':''}'>${driving?'en piste':done?'fait':'à venir'}</div></div></div>`;
});
p.innerHTML=h;}
function renderFull(){
const el=document.getElementById('fullPlan'),now=new Date();
let h=`<div class='lbl'>Planning complet — ${R.length} relais</div>`;
R.forEach(x=>{
 const done=isDone(x,now),tg='';
 h+=`<div class='stint ${done?'done':''}'><div class='rn num'>R${x.r}</div><div class='mid'><div class='e'>${esc(x.name)}${tg}</div>`;
 h+=`<div class='c num' style='color:var(--mut)'>entrée ${jh(x.debut)} · conv. ${hhmm(x.conv)}</div></div><div class='rt'><div class='d num'>${minlbl(x.dur)}</div><div class='st'>cat ${x.cat}</div></div></div>`;
});
el.innerHTML=h;}
function renderLive(){
const el=document.getElementById('live'),now=new Date(),started=now>=dep,url=CFG.live;
let right,cls='';
if(url&&started){right=`<a href='${esc(url)}' target='_blank' rel='noopener'>Ouvrir</a>`;cls='on';}
else if(url){right=`<span class='btn'>Au départ</span>`;}
else{right=`<span class='btn'>À venir</span>`;}
el.className='live '+cls;
const sub=url?(started?'live timing de la course':'disponible au départ de la course'):`lien communiqué par l'organisation`;
el.innerHTML=`<span class='dot'></span><div class='lt'><div class='t'>Chronos en direct</div><div class='s'>${sub}</div></div>`+right;}
document.getElementById('toggleAll').onclick=function(){const f=document.getElementById('fullPlan'),o=f.style.display==='none';f.style.display=o?'block':'none';this.textContent=o?'Masquer le planning':`Planning complet de l'équipe`;if(o)renderFull();};
function tick(){
const now=new Date(),c=document.getElementById('clock');
if(now<dep){const d=Math.floor((dep-now)/1000),j=Math.floor(d/86400);c.innerHTML=`<span>Départ dans</span><b class='num'>`+(j>0?j+'j ':'')+pad(Math.floor(d%86400/3600))+':'+pad(Math.floor(d%3600/60))+`</b>`;}
else if(now<=arrivee){const e=Math.floor((now-dep)/1000);c.innerHTML=`<span>En course</span><b class='num'>`+Math.floor(e/3600)+':'+pad(Math.floor(e%3600/60))+':'+pad(e%60)+`</b>`;}
else c.innerHTML=`<span>Course</span><b>terminée</b>`;}
function checkUpdate(){
if(location.protocol==='file:'||!CFG.maj)return;
fetch(location.pathname+'?v='+Date.now(),{cache:'no-store'}).then(r=>r.ok?r.text():'').then(t=>{
 const m=t.match(/.maj.\s*:\s*.(\d{4}-\d\d-\d\dT\d\d:\d\d:\d\d)/);
 if(m&&m[1]!==CFG.maj)location.replace(location.pathname+'?v='+encodeURIComponent(m[1]));
}).catch(()=>{});}
setInterval(checkUpdate,60000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)checkUpdate();});
window.addEventListener('pageshow',e=>{if(e.persisted)checkUpdate();});
fillMeta();buildSelect();renderPanel();renderLive();tick();renderTrack();
setInterval(()=>{tick();renderLive();renderTrack();if(SEL!==null)renderPanel();},1000);
</script>
</body>
